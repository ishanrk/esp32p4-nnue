name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: train/requirements.txt
      - run: python -m pip install numpy python-chess zstandard
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: cmake -S . -B build-san -DP4_SAN=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-san --parallel
      - run: ctest --test-dir build-san --output-on-failure
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
